name: Build SHIVAM OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository root mein ZIP file nahi mili."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project
          find project -name settings.gradle.kts

      - name: Locate Android project
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts nahi mili. ZIP structure check karo."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        run: gradle -p "$PROJECT_DIR" wrapper --gradle-version 8.9

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHIVAM-OS-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

### 2. Save करो
- **Commit changes** दबाओ।
- फिर [GitHub Actions](https://github.com/sebiusche-spec/Ai/actions) खोलो।
- **Build SHIVAM OS APK → Run workflow** चलाओ।

अगर फिर error आए, तो इस बार केवल **लाल ❌ वाले step का नाम और error की आखिरी 10 लाइनें** भेजना। APK बनने तक हम errors एक-एक करके ठीक करेंगे।
