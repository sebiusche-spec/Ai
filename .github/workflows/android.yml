name: Build SHIVAM OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SHIVAM_OS_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q SHIVAM_OS_Android_Project.zip -d project
          find project -name settings.gradle.kts

      - name: Locate project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        run: gradle -p "$PROJECT_DIR" wrapper --gradle-version 8.9

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHIVAM-OS-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
